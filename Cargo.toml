[workspace]
resolver = "2"
rust-version = "1.87"
members = [
    "bindgen",
    "fixtures",
    "fixtures/errors",
    "fixtures/destroy",
    "fixtures/objects",
    "fixtures/name-case",
    "fixtures/regressions/*"
]

[workspace.package]
version = "0.7.1+v0.31.0-patch.1"
edition = "2021"

[workspace.metadata.crane]
name = "uniffi-bindgen-go"

[workspace.dependencies]
uniffi = { git = "https://github.com/mozilla/uniffi-rs", tag = "v0.31.0" }
uniffi_testing = { git = "https://github.com/mozilla/uniffi-rs", tag = "v0.31.0" }
uniffi_macros = { git = "https://github.com/mozilla/uniffi-rs", tag = "v0.31.0" }
uniffi_build = { git = "https://github.com/mozilla/uniffi-rs", tag = "v0.31.0", features=["builtin-bindgen"] }
uniffi_bindgen = { git = "https://github.com/mozilla/uniffi-rs", tag = "v0.31.0" }
uniffi_meta = { git = "https://github.com/mozilla/uniffi-rs", tag = "v0.31.0" }
uniffi_udl = { git = "https://github.com/mozilla/uniffi-rs", tag = "v0.31.0" }
